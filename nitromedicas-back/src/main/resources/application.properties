spring.application.name=nitromedicas

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- MySQL (local por defecto, Docker Compose lo sobreescribe) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/nitromedicas_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# --- Logging ---
log.pattern.console=[%thread] %-5level: %logger - %msg%n
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
spring.main.banner-mode=off